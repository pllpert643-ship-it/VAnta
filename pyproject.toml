[project]
name = "vanta-gpu-controller"
version = "0.1.0"
description = "A user-level GPU workload controller for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nvidia-ml-py>=12.560.30",
    "psutil>=6.0.0",
    "pyside6>=6.8.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.3.0",
]

[project.scripts]
vanta = "vanta.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vanta"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
